version: 0.1.2
description: Base ontology schema for Personal KG with user-extensible types.
entityTypes:
  person:
    description: Human identities in the user's personal/work graph.
    required:
      - id
      - label
    properties:
      handles:
        type: string[]
      timezone:
        type: string
      roles:
        type: string[]
  project:
    description: Ongoing projects, repos, initiatives, or goals.
    required:
      - id
      - label
    properties:
      status:
        type: string
      repo:
        type: string
      priority:
        type: string
      tags:
        type: string[]
  skill:
    description: Skills and capability modules with ontology access declarations.
    required:
      - id
      - label
    properties:
      reads:
        type: string[]
      writes:
        type: string[]
      source:
        type: string
  task:
    description: Actionable work units and plans.
    required:
      - id
      - label
    properties:
      state:
        type: string
      due:
        type: string
      intensity:
        type: string
  concept:
    description: Abstract ideas, preferences, style, and evolving patterns.
    required:
      - id
      - label
    properties:
      domain:
        type: string
      confidence:
        type: number
  sample:
    description: Audio sample clip from local packs or UVT soundbanks.
    required:
      - id
      - label
    properties:
      file:
        type: string
      bpm:
        type: number
      key:
        type: string
      source:
        type: string
  stem:
    description: Isolated stem generated from track separation.
    required:
      - id
      - label
    properties:
      sourceTrack:
        type: string
      role:
        type: string
  track:
    description: Individual song or production unit.
    required:
      - id
      - label
    properties:
      key:
        type: string
      bpm:
        type: number
      energy:
        type: number
  set:
    description: DJ set plan with transitions and crowd-flow metadata.
    required:
      - id
      - label
    properties:
      venue:
        type: string
      durationMinutes:
        type: number
      energyArc:
        type: string
  progression:
    description: Chord/melodic progression blueprint.
    required:
      - id
      - label
    properties:
      key:
        type: string
      bars:
        type: number
      styleSignature:
        type: string[]
  performancelog:
    description: Realtime performance telemetry and operator notes.
    required:
      - id
      - label
    properties:
      crowdEnergy:
        type: number
      latencyMs:
        type: number
      clipping:
        type: boolean
  uvtpreset:
    description: Preset exported for local UVT workflows.
    required:
      - id
      - label
    properties:
      presetPath:
        type: string
      instrument:
        type: string
  pluginpatch:
    description: Patch definition for Max/MSP, VST, or WebAudio.
    required:
      - id
      - label
    properties:
      target:
        type: string
      patchPath:
        type: string
relationTypes:
  references:
    from:
      - task
      - project
      - concept
    to:
      - concept
      - project
      - person
  owns:
    from:
      - person
    to:
      - project
      - task
  depends_on:
    from:
      - task
      - project
    to:
      - task
      - project
  implemented_by:
    from:
      - concept
      - project
    to:
      - skill
  blocked_by:
    from:
      - task
      - project
    to:
      - concept
      - task
  sampled_from:
    from:
      - stem
      - track
    to:
      - sample
  arranged_in:
    from:
      - track
    to:
      - set
  logs:
    from:
      - performancelog
    to:
      - set
      - track
  exports_to:
    from:
      - progression
      - pluginpatch
    to:
      - uvtpreset
alerts:
  invalid_relation:
    severity: high
  missing_required_property:
    severity: medium
  unknown_entity_type:
    severity: medium
